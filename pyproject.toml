[project]
name = "guess-num"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=0.29.0",
    "hydra-core>=1.3.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "omegaconf>=2.3.0",
    "pytorch-lightning>=2.0.0",
    "tensorboard>=2.14.0",
    "torch>=2.0.0",
    "tqdm>=4.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

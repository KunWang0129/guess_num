# Default configuration for sequence bank generation

defaults:
  - _self_

seed: 123
digit_min: 0
digit_max: 9
test: false

sequence_length: 10
count: 1000

# Available sequence families:
# - uniform: Random sequences drawn from the configured digit range
# - palindrome: Symmetric palindromes mirroring digits across the sequence
# - same_number_block: Contiguous identical digit blocks anchored with leading ones
# - gaussian_sequence: Gaussian-distributed digits clipped to range with fixed anchors
# - monotonic_sequence: Non-decreasing sequences from 0 to 9
# - sum_targeter: Sequences adjusted to hit a global digit sum target
# - high_low_alternator: Alternating low/high digit assignments with fixed endpoints
# - repetitive_pattern: Repeating digit motifs such as the 8-4 pattern
# - digits_of_pi: Prefixes of π's digit expansion
# - difference_maintaining: Sequences constrained to a narrow value band (width 4)

family:
  name: mixed
  families:
    - name: uniform
    - name: palindrome
    - name: same_number_block
      params:
        max_block_size: 4
    - name: gaussian_sequence
      params:
        mean: 5.0
        variance: 2.0
        anchor_value: 5
    - name: monotonic_sequence
      params:
        start_digit: 0
        end_digit: 9
    - name: sum_targeter
      params:
        target_sum: 60
    - name: high_low_alternator
    - name: repetitive_pattern
      params:
        pattern: [8, 4]
    - name: digits_of_pi
    - name: difference_maintaining
      params:
        range_width: 4

output:
  dir: ./data/sequence_bank
  prefix: sequence_bank
  format: jsonl
  include_timestamp: false

manifest: true

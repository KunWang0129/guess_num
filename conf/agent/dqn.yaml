# DQN Agent Configuration
# Parameters for Deep Q-Network agent with options support

# Learning parameters
learning_rate: 1e-3
gamma: 0.99  # Discount factor
batch_size: 32

# Exploration parameters
eps_start: 1.0
eps_end: 0.05
eps_decay: 0.995

# Target network update
target_update_freq: 100  # Update target network every N steps
soft_update_tau: 0.001  # For soft updates (if enabled)
use_soft_updates: false

# Training parameters
max_episodes: 1000
max_steps_per_episode: 100

# Options-specific parameters
use_macro_options: true
option_epsilon: 0.1  # Separate epsilon for option selection
option_termination_bonus: 0.0  # Bonus for successful option completion

# Network architecture
model_type: "mlp"
hidden_sizes: [128, 128]
activation: "relu"
dropout_rate: 0.1

# Replay buffer
buffer_size: 10000
min_replay_size: 1000
prioritized_replay: false

# Available options to use (can be toggled)
options:
  guess_first_half: true
  complementary_guess: true
  odd_numbers_only: true
  gaussian_guess: true

# Debugging and monitoring
verbose: false
log_q_values: false
log_option_usage: true

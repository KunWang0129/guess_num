# Manual inference configuration for the sequence guessing agent

defaults:
  - agent: dqn
  - env: sequence_guesser
  - _self_

project:
  name: "sequence_guessing_rl"
  version: "1.0.0"
  description: "RL Agent with Options Framework for Sequence Guessing Game"

seed: 42

device: auto

checkpoint:
  path: "./logs/checkpoints/best_model_episode_400.ckpt"

inference:
  target_sequence: [1, 7, 1, 8, 0, 8, 2, 8, 0, 8]
  deterministic: false
  max_steps: null

env_overrides:
  enabled: true
  verbose: null
  max_episode_steps: 1000
  provide_feedback: null
  allow_repeated_guesses: null

logging:
  level: "INFO"

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}/infer
  job:
    name: infer_${project.name}

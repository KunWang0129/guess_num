# Main Configuration File for Sequence Guessing RL Agent
# This file composes the final configuration from sub-directories

defaults:
  - agent: dqn
  - env: sequence_guesser
  - trainer: default
  - _self_

# Global project settings
project:
  name: "sequence_guessing_rl"
  version: "1.0.0"
  description: "RL Agent with Options Framework for Sequence Guessing Game"

# Experiment settings
experiment:
  name: "dqn_with_options"
  save_dir: "./logs"
  checkpoint_dir: "./logs/checkpoints"

# Random seed for reproducibility
seed: 42

# Logging
logging:
  level: "INFO"
  log_dir: "./logs"
  tensorboard: true
  wandb: false

# Device configuration
device: "auto"  # auto, cpu, gpu

# Evaluation settings
evaluation:
  eval_every: 100  # Episodes between evaluations
  eval_episodes: 10
  save_best_model: true

# Training settings
training:
  max_episodes: 1000
  early_stopping_patience: 200  # Episodes without improvement before stopping
  save_checkpoint_every: 100  # Episodes between checkpoint saves

# Data loading (optional sequence bank integration)
data_loader:
  enabled: false
  path: null  # e.g., ./data/sequence_bank/sequence_bank.jsonl
  families: []  # Optional list of family names to sample from
  limit: null   # Optional cap on number of records to load
  shuffle: true
  cycle: true
  strict: true
  seed: ${seed}

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: ${project.name}_${experiment.name}
